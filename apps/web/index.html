<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1210" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        try {
          const guardado = localStorage.getItem("patrimonio-tema");
          const modo = guardado === "light" ? "light" : "dark";
          document.documentElement.style.colorScheme = modo;
          document.documentElement.style.backgroundColor =
            modo === "dark" ? "#0b1210" : "#f4f6f5";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", modo === "dark" ? "#0b1210" : "#0f4c3a");
        } catch {
          document.documentElement.style.backgroundColor = "#0b1210";
        }
      })();
    </script>
    <meta
      name="description"
      content="Sistema de gestión patrimonial de la Municipalidad de Garupá"
    />
    <link rel="icon" type="image/x-icon" href="/logoMuni.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Patrimonio Garupá</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
